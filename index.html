<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Servo Control</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        body {
            background: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { color: #00adb5; margin-bottom: 10px; }
        .status-dot {
            height: 10px; width: 10px;
            background-color: #bbb;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .online { background-color: #00ff00; box-shadow: 0 0 10px #00ff00; }
        
        /* Slider Styling */
        .slider-container { margin: 40px 0; }
        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 15px;
            border-radius: 10px;
            background: #393e46;
            outline: none;
            cursor: pointer;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #00adb5;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 173, 181, 0.8);
        }

        .angle-display {
            font-size: 48px;
            font-weight: bold;
            color: #00adb5;
            margin: 20px 0;
        }
        .btn-group { display: flex; justify-content: space-around; }
        button {
            background: #393e46;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #00adb5; }
    </style>
</head>
<body>

<div class="container">
    <h1>Servo Remote</h1>
    <p><span id="dot" class="status-dot"></span> System Connected</p>
    
    <div class="angle-display"><span id="angleText">90</span>°</div>

    <div class="slider-container">
        <input type="range" min="0" max="180" value="90" class="slider" id="servoSlider">
    </div>

    <div class="btn-group">
        <button onclick="updateServo(0)">Min (0°)</button>
        <button onclick="updateServo(90)">Center (90°)</button>
        <button onclick="updateServo(180)">Max (180°)</button>
    </div>
</div>

<script>
    // --- 1. YOUR FIREBASE CONFIG ---
    // Make sure the URL matches exactly what you see in your Firebase Console
    const firebaseConfig = {
        databaseURL: "https://myesp32control-eabfc-default-rtdb.firebaseio.com/"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const slider = document.getElementById("servoSlider");
    const angleText = document.getElementById("angleText");
    const dot = document.getElementById("dot");

    // --- 2. UPDATE FIREBASE ON SLIDE ---
    slider.oninput = function() {
        updateServo(this.value);
    }

    function updateServo(val) {
        val = parseInt(val);
        angleText.innerText = val;
        slider.value = val;
        
        // Push the new angle to Firebase
        db.ref('ledStatus').set(val)
          .then(() => {
              console.log("Syncing: " + val + "°");
              dot.classList.add("online");
          })
          .catch((error) => {
              console.error("Firebase Error:", error);
              dot.classList.remove("online");
          });
    }

    // --- 3. LISTEN FOR CHANGES (Real-time Sync) ---
    // If you change the value in the Firebase console, the website updates too!
    db.ref('ledStatus').on('value', (snapshot) => {
        const cloudVal = snapshot.val();
        if (cloudVal !== null) {
            slider.value = cloudVal;
            angleText.innerText = cloudVal;
            dot.classList.add("online");
        }
    });
</script>

</body>
</html>
