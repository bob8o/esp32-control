<!DOCTYPE html>
<html>
<head>
    <title>ESP32 Global Remote</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background: #1a1a1a; color: white; text-align: center; font-family: 'Segoe UI', sans-serif; }
        .btn { padding: 40px; width: 80%; max-width: 300px; font-size: 24px; border-radius: 20px; border: none; margin: 20px; cursor: pointer; transition: 0.3s; }
        .on { background: #f1c40f; color: black; box-shadow: 0 0 20px #f1c40f; }
        .off { background: #2c3e50; color: white; }
    </style>
</head>
<body>
    <h1>Cloud LED Control</h1>
    <button class="btn on" onclick="setLight(1)">LIGHT ON</button><br>
    <button class="btn off" onclick="setLight(0)">LIGHT OFF</button>

    <script>
        // Paste your Firebase Config from Project Settings > Apps > Web (</>)
        const firebaseConfig = {
            databaseURL: "https://myesp32control-eabfc-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function setLight(val) {
            db.ref('ledStatus').set(val);
        }
    </script>
</body>
</html>
